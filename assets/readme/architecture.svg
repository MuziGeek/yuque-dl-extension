<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">架构：MV3 UI → core 纯逻辑层 → platform 浏览器能力适配层</title>
  <desc id="archDesc">三层架构图：顶层为 Chrome/Edge Manifest V3 界面组件（popup、panel、options、background）；中间 core 层是直接移植自 yuque-dl 的纯逻辑（yuque-api、download-book、download-article、download-images、attachments、markdown）；底层 platform 层是把 Node 能力替换为浏览器 API 的适配层（fs、http、crypto、auth、progress、fs-handle-store）。</desc>

  <rect width="1200" height="420" rx="24" fill="#0E1512"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="#1E2B25"/>

  <defs>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 0 L 5 9 z" fill="#00B96B"/>
    </marker>
  </defs>

  <!-- header -->
  <rect x="64" y="42" width="3" height="16" rx="1.5" fill="#00B96B"/>
  <text x="82" y="40" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2.6" fill="#6F8A7E">ARCHITECTURE</text>
  <text x="284" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="600" fill="#E8F1EC">三层架构</text>

  <!-- === UI layer === -->
  <g id="ui-layer" transform="translate(0 100)">
    <!-- popup -->
    <rect x="64" y="0" width="200" height="64" rx="10" fill="#16211C" stroke="#26362E"/>
    <text x="84" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#E8F1EC">popup</text>
    <text x="84" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6F8A7E">弹窗 · 入口</text>

    <!-- panel -->
    <rect x="292" y="0" width="440" height="64" rx="10" fill="#16211C" stroke="#00B96B" stroke-width="2"/>
    <text x="312" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#E8F1EC">panel</text>
    <text x="312" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6F8A7E">下载面板 · 主循环与 UI 交互</text>

    <!-- options -->
    <rect x="760" y="0" width="200" height="64" rx="10" fill="#16211C" stroke="#26362E"/>
    <text x="780" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#E8F1EC">options</text>
    <text x="780" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6F8A7E">设置 · 手动 Token</text>

    <!-- background -->
    <rect x="980" y="12" width="156" height="40" rx="8" fill="#16211C" stroke="#26362E"/>
    <text x="998" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#E8F1EC">background</text>
    <text x="998" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#6F8A7E">入口路由</text>
  </g>

  <!-- arrows UI → core -->
  <line x1="164" y1="164" x2="164" y2="200" stroke="#26362E" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="512" y1="164" x2="512" y2="200" stroke="#26362E" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="860" y1="164" x2="860" y2="200" stroke="#26362E" stroke-width="1.5" marker-end="url(#down)"/>
  <line x1="1058" y1="164" x2="1058" y2="200" stroke="#26362E" stroke-width="1.5" marker-end="url(#down)"/>

  <!-- === Core layer === -->
  <rect x="64" y="200" width="1072" height="90" rx="14" fill="#16211C" stroke="#26362E"/>
  <text x="88" y="230" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#E8F1EC">core</text>
  <text x="134" y="230" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#6F8A7E">纯逻辑层 · 直接移植自 yuque-dl</text>

  <!-- core chips row 1 -->
  <rect x="318" y="240" width="144" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="336" y="261" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">yuque-api</text>
  <rect x="476" y="240" width="187" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="494" y="261" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">download-book</text>
  <rect x="677" y="240" width="220" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="695" y="261" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">download-article</text>

  <!-- core chips row 2 -->
  <rect x="360" y="280" width="187" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="378" y="301" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">download-images</text>
  <rect x="561" y="280" width="155" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="579" y="301" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">attachments</text>
  <rect x="730" y="280" width="131" height="30" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="748" y="301" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">markdown</text>

  <!-- arrow core → platform -->
  <line x1="600" y1="290" x2="600" y2="312" stroke="#26362E" stroke-width="2" marker-end="url(#down)"/>

  <!-- === Platform layer === -->
  <rect x="64" y="312" width="1072" height="80" rx="14" fill="#16211C" stroke="#26362E"/>
  <text x="88" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#E8F1EC">platform</text>
  <text x="184" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" fill="#6F8A7E">浏览器能力适配层</text>

  <!-- platform chips 2x3 grid -->
  <rect x="330" y="354" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="348" y="372" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">fs (FSA)</text>
  <rect x="516" y="354" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="534" y="372" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">http (fetch)</text>
  <rect x="702" y="354" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="720" y="372" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">crypto</text>

  <rect x="330" y="386" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="348" y="404" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">auth + DNR</text>
  <rect x="516" y="386" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="534" y="404" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">progress</text>
  <rect x="702" y="386" width="170" height="26" rx="6" fill="#0E1512" stroke="#26362E"/>
  <text x="720" y="404" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" fill="#A9BDB3">FSA handle</text>
</svg>
